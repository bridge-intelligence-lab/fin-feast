[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-feast"
version = "0.1.0"
description = "Feast POC for FX/Crypto using Polygon (Offline + Online with streaming)"
readme = "README.md"
authors = [{name = "Rodrigo Oliveira"}]
requires-python = ">=3.11"
dependencies = [
  "feast>=0.38.0",
  "redis>=5.0.0",
  "pandas>=2.2.2",
  "pyarrow>=15.0.0",
  "numpy>=1.26",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "tenacity>=8.2.3",
  "requests>=2.32.0",
  "polygon-api-client>=1.12.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.0",
  "ruff>=0.6.5",
  "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["fin_feast*"]

[project.scripts]
finfeast-materialize = "scripts.materialize_incremental:main"
finfeast-generate = "scripts.generate_synthetic_data:main"
finfeast-validate = "scripts.validate_streaming:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "PT", "RET", "SIM", "PTH", "PL" ]
ignore = ["E501"]

# Balance strictness: relax some rules in tests and imperative scripts.
[tool.ruff.lint.per-file-ignores]
# Tests can be longer, use literals, and have combined asserts.
"tests/**/*" = [
  "PLR0912",  # too many branches
  "PLR0915",  # too many statements
  "PLR2004",  # magic value used in comparison
  "PT018",    # combined assertions
  "PT011",    # broad raises in tests
  "C405",     # set literal construction
  "F841",     # intentionally unused locals in tests
]
# Allow longer/branchy CLI-style scripts while keeping safety rules.
"scripts/build_training_dataset.py" = ["PLR0912", "PLR0915"]
"scripts/fetch_polygon_to_parquet.py" = ["PLR0912"]
"scripts/generate_synthetic_data.py" = ["SIM108", "PLR2004"]
"scripts/fetch_binance_to_parquet.py" = ["SIM108", "F841"]
"scripts/validate_streaming.py" = ["PLR0915", "SIM105"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
