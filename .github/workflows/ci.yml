name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e .[dev]
      - name: Lint
        run: |
          ruff check .
      - name: Type check (mypy)
        run: |
          mypy
      - name: Run unit tests
        env:
          FEAST_DATA_ZONE: current
        run: |
          pytest -q tests/unit -m "not integration and not network"
      - name: Optional E2E tests (Binance only)
        if: ${{ vars.ENABLE_E2E == '1' }}
        env:
          E2E_VERBOSE: '1'
        run: |
          pytest -q tests/e2e/test_e2e_quickstart.py -s
          pytest -q tests/e2e/test_e2e_binance_batch.py -s -k binance_batch
      - name: Optional E2E Polygon tests
        if: ${{ vars.ENABLE_E2E == '1' && secrets.POLYGON_API_KEY != '' }}
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          E2E_VERBOSE: '1'
        run: |
          pytest -q tests/e2e/test_e2e_polygon_batch.py -s -k polygon_batch
          pytest -q tests/e2e/test_e2e_streaming_polygon.py -s -k streaming_polygon

  integration:
    if: ${{ vars.ENABLE_INTEGRATION == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e .[dev]
      - name: Start Redis via docker-compose
        run: |
          docker-compose up -d
      - name: Run integration tests
        env:
          FEAST_DATA_ZONE: current
        run: |
          pytest -q -m "integration"
      - name: Stop Redis
        if: always()
        run: |
          docker-compose down -v || true

  secrets-scan:
    if: ${{ vars.ENABLE_LEAK_SCAN == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: detect --source . --no-banner --redact --report-format sarif --report-path gitleaks.sarif
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
