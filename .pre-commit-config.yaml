repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-ast
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: pytest-unit
        name: unit tests (pre-push)
        entry: pytest
        language: system
        pass_filenames: false
        args: ["-q", "tests/unit", "-m", "not integration and not network"]
        stages: [push]
